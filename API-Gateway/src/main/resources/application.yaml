server:
  port: 8080
jwt:
  secret-key: "ThisIsMySuperSecretKeyForJWTAuthentication123456789"
  expiration: 300000
spring:
  application:
    name: Api-Gateway
  config:
    import: optional:configserver:http://localhost:8084
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: user-service-route
              uri: lb://USER-SERVICE-DEV
              predicates:
                - Path=/api/v1/customers/**,/api/v1/auth/**,/api/v1/owners/**,/api/v1/internal/**,/api/v1/users/**
              filters:
                - AddRequestHeader=X-SOURCE,GATEWAY
                - AddResponseHeader=X-API-VERSION,V1
                - RemoveRequestHeader=Cookie
                - RemoveResponseHeader=Server

            - id: hotel-service-route
              uri: lb://HOTEL-SERVICE-DEV
              predicates:
                - Path=/api/v1/hotels/**

            - id: rating-service-route
              uri: lb://RATING-SERVICE-DEV
              predicates:
                - Path=/api/v1/ratings/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway   # ✅ This was missing

info:
  app:
    name: API-GATEWAY
    description: Api Gateway
    version: 1.0