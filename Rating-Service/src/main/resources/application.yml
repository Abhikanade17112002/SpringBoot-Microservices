jwt:
  secret-key: "ThisIsMySuperSecretKeyForJWTAuthentication123456789"
  expiration: 300000
spring:
  application:
    name: RATING-SERVICE
  profiles:
    active: dev
  config:
    import: optional:configserver:http://localhost:8084

resilience4j:

  circuitbreaker:

    instances:

      createNewRatingCB:

        registerHealthIndicator: true

        slidingWindowSize: 10

        minimumNumberOfCalls: 5

        failureRateThreshold: 50

        waitDurationInOpenState: 10s

        permittedNumberOfCallsInHalfOpenState: 3

        automaticTransitionFromOpenToHalfOpenEnabled: true

management:

  health:

    circuitbreakers:

      enabled: true

  endpoints:

    web:

      exposure:

        include:
          - health
          - metrics
          - circuitbreakers